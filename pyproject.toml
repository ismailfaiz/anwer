[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anwer"
version = "0.0.1"
description = "Engine-agnostic profiler and observability toolkit for LLM inference systems"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Ismail" }
]
keywords = ["llm", "inference", "profiling", "observability", "vllm", "sglang"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PLACEHOLDER_ORG/anwer"

[tool.hatch.build.targets.wheel]
packages = ["src/anwer"]
